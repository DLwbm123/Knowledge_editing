no_grad_layers: null

# DSCA Stage 1 defaults
dsca_layer: 21
dsca_layer_module: null
dsca_freeze_vlm: True
dsca_rank: 128
dsca_gate_bottleneck: 64
dsca_min_samples: 32
dsca_refine_interval: 500
dsca_cluster_alpha: 2.0
dsca_proto_ema: 0.95
dsca_tau_visual: 0.0
dsca_route_temperature: 0.07
dsca_distill_temperature: 0.07
dsca_lambda_align: 0.5
dsca_lambda_distill: 1.0
dsca_lambda_sparse: 1.0e-2
dsca_task_weight: 1.0
dsca_update_clusters_during_training: True
dsca_update_clusters_during_inference: False
dsca_freeze_repository_at_eval: True
dsca_require_masks: True
dsca_candidate_topk: null
dsca_residual_scale: 1.0
dsca_residual_apply_mask: attention
dsca_repository_path: null
dsca_dsam_init_std: 0.02
dsca_max_buffer_size: null
dsca_debug: False

# Eval
batch_size: 1
model_save_pt: 5000
silent: False
