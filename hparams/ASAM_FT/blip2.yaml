# Model
device: 0

alg_name: "ASAM_FT"
name: hugging_cache/opt-2.7b
model_name: blip2
model_class: Blip2OPT
tokenizer_class: GPT2Tokenizer
tokenizer_name: hugging_cache/opt-2.7b
inner_params:
- opt_model.model.decoder.layers.31.fc1.weight
- opt_model.model.decoder.layers.31.fc2.weight

# Method
alg: ASAM_FT
num_steps: 15
lr: 1e-6
edit_lr: 2e-4
lr_lr: 1e-4
lr_scale: 1.0
weight_decay: 0
seed: 42
cedit: 0.1
iedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: False
n_hidden: 1
hidden_dim: null
init: id
norm: True
combine: True
x_only: False
delta_only: False
act: relu
rank: 1920
mlp_class: IDMLP
shared: True
archive: null

# ASAM
asam_enabled: True
asam_use_lar: True
asam_epsilon: 1.0e-3
asam_num_variants: 4
asam_lar_step_size: 1.0e-3
asam_beta: 10.0
asam_tau: 4.0
asam_use_dataset_variants: False
asam_variant_ce_weight: 0.0
asam_pooling: prompt_or_image_only
# Leave null to infer the edited transformer block output.
# Example override: opt_model.model.decoder.layers.31
asam_capture_module: null
asam_alignment_params: null
asam_allow_attention_pooling_fallback: False
asam_debug_grad_check: False
asam_debug_require_all_inner_grads: False

# Train
batch_size: 1
model_save_pt: 5000
silent: False
max_iters: 50000
log_interval: 100
eval_log_interval: 1000
final_eval: True
val_interval: 5000
early_stop_patience: 6000
early_stop_key: "loss/total_edit_val"
eval_only: True
half: False
debug: False
save: False
verbose: True

val_batch_size: 1
accumulate_bs: 2
val_steps: 500
opt: Adam
grad_clip: 100.

# Output
results_dir: ./results

# Multimodal
qformer_checkpoint: hugging_cache/blip2_pretrained_opt2.7b.pth
qformer_name_or_path: hugging_cache/bert-base-uncased
state_dict_file: hugging_cache/eva_vit_g.pth
freeze_qformer: True
pretrained_ckpt: null

# image
coco_image: datasets/VLKEB_images/mmkb_images
rephrase_image: datasets/VLKEB_images/mmkb_images
